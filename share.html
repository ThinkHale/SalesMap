<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesMap — Shared View</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  #header { background: #0078d4; color: white; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #header h1 { font-size: 16px; font-weight: 600; }
  #header .subtitle { font-size: 12px; opacity: 0.8; }
  .read-only-badge { background: #e8f4fc; color: #0078d4; font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid #b3d7f0; flex-shrink: 0; }
  #heatToggle { display: none; margin-left: auto; padding: 4px 12px; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 10px; font-size: 11px; cursor: pointer; flex-shrink: 0; }
  #heatToggle.active { background: white; color: #0078d4; border-color: #b3d7f0; }
  #map { flex: 1; min-height: 0; display: none; }
  #status { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #555; }
  #status.error { color: #c00; }
  .legend { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); max-width: 200px; max-height: 300px; overflow-y: auto; }
  .legend-title { font-weight: 600; font-size: 13px; margin-bottom: 8px; color: #333; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; color: #555; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .iw-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #333; }
  .iw-row { font-size: 12px; margin-bottom: 3px; }
  .iw-label { font-weight: 500; color: #555; margin-right: 4px; }
  .iw-value { color: #333; }
</style>
</head>
<body>
<div id="header">
  <div>
    <h1>SalesMap — Shared View</h1>
    <div class="subtitle" id="subtitle">Loading…</div>
  </div>
  <button id="heatToggle">Heatmap</button>
  <span class="read-only-badge">View Only</span>
</div>
<div id="status">Loading map…</div>
<div id="map"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/wellknown@0.5.0/wellknown.js"></script>
<script>
firebase.initializeApp({
  apiKey: 'AIzaSyDZGxOQGI30L1LFkwbOAvNS_OfT0U76_ck',
  authDomain: 'salesmap-4771d.firebaseapp.com',
  projectId: 'salesmap-4771d',
  databaseURL: 'https://salesmap-4771d-default-rtdb.firebaseio.com/'
});

function showError(msg) {
  var el = document.getElementById('status');
  el.style.display = '';
  el.textContent = msg;
  el.className = 'error';
}

function renderMap(snapshot) {
  document.getElementById('status').style.display = 'none';
  var mapEl = document.getElementById('map');
  mapEl.style.display = 'block';

  var d = snapshot.createdAt ? new Date(snapshot.createdAt).toLocaleString() : '';
  document.getElementById('subtitle').textContent = d ? 'Shared ' + d : 'Read-only view';
  document.title = 'SalesMap — Shared ' + (d || 'View');

  var map = L.map('map').setView([snapshot.center.lat, snapshot.center.lng], snapshot.zoom);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  var LegendControl = L.Control.extend({
    onAdd: function() {
      var div = L.DomUtil.create('div', 'legend');
      var title = document.createElement('div');
      title.className = 'legend-title';
      title.textContent = 'Layers';
      div.appendChild(title);
      (snapshot.layers || []).forEach(function(layer) {
        if (!layer.visible) return;
        var item = document.createElement('div');
        item.className = 'legend-item';
        var dot = document.createElement('div');
        dot.className = 'legend-dot';
        dot.style.background = layer.color || '#0078d4';
        var name = document.createElement('span');
        name.textContent = layer.name;
        item.appendChild(dot);
        item.appendChild(name);
        div.appendChild(item);
      });
      return div;
    }
  });
  new LegendControl({ position: 'bottomleft' }).addTo(map);

  var TIER_COLORS = snapshot.tierColors || {};
  var PIN_PATH = snapshot.pinPath || '';

  function makeIcon(color) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -42 24 42" width="24" height="42">'
      + '<path d="' + PIN_PATH + '" fill="' + color + '" stroke="white" stroke-width="1.5"/>'
      + '</svg>';
    return L.divIcon({ html: svg, className: '', iconSize: [24, 42], iconAnchor: [12, 42], popupAnchor: [0, -42] });
  }

  function makePopupContent(feature) {
    var html = '<div style="padding:4px"><div class="iw-title">' + (feature.name || 'Feature') + '</div>';
    ['description', 'tier', 'bdm', 'revenue'].forEach(function(prop) {
      if (feature[prop]) {
        html += '<div class="iw-row"><span class="iw-label">' + prop + ':</span>'
              + '<span class="iw-value">' + feature[prop] + '</span></div>';
      }
    });
    return html + '</div>';
  }

  // Cluster icon renderer — mirrors the live app's tiered SVG style
  function clusterStyle(count) {
    if (count < 10)  return { color: '#4CAF50', size: 40 };
    if (count < 50)  return { color: '#FF9800', size: 50 };
    if (count < 100) return { color: '#F44336', size: 60 };
    if (count < 500) return { color: '#9C27B0', size: 70 };
    return { color: '#E91E63', size: 80 };
  }
  function lightenColor(hex, pct) {
    var n = parseInt(hex.replace('#',''), 16), amt = Math.round(2.55 * pct);
    var r = Math.min(255,(n>>16)+amt), g = Math.min(255,((n>>8)&0xff)+amt), b = Math.min(255,(n&0xff)+amt);
    return '#' + [r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
  }
  function makeClusterIcon(cluster) {
    var count = cluster.getChildCount(), s = clusterStyle(count);
    var light = lightenColor(s.color, 20), label = count >= 1000 ? (count/1000).toFixed(1)+'K' : String(count);
    var fs = s.size * 0.35, uid = 'c' + Math.random().toString(36).slice(2);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+s.size+'" height="'+s.size+'" viewBox="0 0 '+s.size+' '+s.size+'">'
      + '<defs><radialGradient id="'+uid+'" cx="35%" cy="35%"><stop offset="0%" style="stop-color:'+light+';stop-opacity:1"/><stop offset="100%" style="stop-color:'+s.color+';stop-opacity:1"/></radialGradient></defs>'
      + '<circle cx="'+(s.size/2)+'" cy="'+(s.size/2)+'" r="'+(s.size/2-2)+'" fill="url(#'+uid+')" stroke="white" stroke-width="2"/>'
      + '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="white" font-size="'+fs+'" font-family="Arial,sans-serif" font-weight="bold">'+label+'</text></svg>';
    return L.divIcon({ html: svg, className: '', iconSize: [s.size, s.size] });
  }

  var cs = snapshot.clusterSettings;
  function makePointGroup() {
    if (cs && typeof L.markerClusterGroup === 'function') {
      return L.markerClusterGroup({
        maxClusterRadius: cs.gridSize || 60,
        disableClusteringAtZoom: (cs.maxZoom || 16) + 1,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        iconCreateFunction: makeClusterIcon
      });
    }
    return L.layerGroup();
  }

  var allPointGroups = []; // tracked so the heatmap toggle can restore them

  (snapshot.layers || []).forEach(function(layer) {
    if (!layer.visible) return;
    var layerGroup = makePointGroup();
    (layer.features || []).forEach(function(feature) {
      if (feature.wkt) {
        try {
          var parsed = wellknown ? wellknown.parse(feature.wkt) : null;
          if (parsed && parsed.coordinates) {
            var latlngs = parsed.coordinates[0].map(function(c) { return [c[1], c[0]]; });
            var fillColor = TIER_COLORS[String(feature.tier || '').toLowerCase()] || layer.color || '#0078d4';
            L.polygon(latlngs, {
              fillColor: fillColor, fillOpacity: 0.35,
              color: layer.color || '#0078d4', weight: 2
            }).bindPopup(makePopupContent(feature)).addTo(map);
          }
        } catch(e) {}
      } else if (feature.latitude && feature.longitude) {
        var tierColor = TIER_COLORS[String(feature.tier || '').toLowerCase()];
        var color = tierColor || layer.color || '#0078d4';
        L.marker(
          [parseFloat(feature.latitude), parseFloat(feature.longitude)],
          { icon: makeIcon(color), title: feature.name || '' }
        ).bindPopup(makePopupContent(feature)).addTo(layerGroup);
      }
    });
    layerGroup.addTo(map);
    allPointGroups.push(layerGroup);
  });

  if (snapshot.heatmap && snapshot.heatmap.points && snapshot.heatmap.points.length) {
    var hm = snapshot.heatmap;
    // Convert colorRange [r,g,b,a] stops to leaflet.heat gradient (same logic as the HTML export)
    var leafletGradient = null;
    if (Array.isArray(hm.colorRange)) {
      leafletGradient = {};
      hm.colorRange.forEach(function(stop, i, arr) {
        var key = (i / (arr.length - 1)).toFixed(2);
        leafletGradient[key] = 'rgba('+stop[0]+','+stop[1]+','+stop[2]+','+(stop[3]/255).toFixed(2)+')';
      });
    }
    var heatOpts = {
      radius:     hm.radius     || 30,
      max:        parseFloat((1 / (hm.intensity || 1)).toFixed(3)),
      minOpacity: Math.max(0.02, hm.threshold || 0.05),
      blur:       15
    };
    if (leafletGradient) heatOpts.gradient = leafletGradient;
    var heatLayer = L.heatLayer(hm.points, heatOpts);

    var toggleBtn = document.getElementById('heatToggle');
    toggleBtn.style.display = 'block';
    var heatOn = false;

    toggleBtn.addEventListener('click', function() {
      heatOn = !heatOn;
      if (heatOn) {
        allPointGroups.forEach(function(g) { map.removeLayer(g); });
        heatLayer.addTo(map);
        toggleBtn.classList.add('active');
      } else {
        map.removeLayer(heatLayer);
        allPointGroups.forEach(function(g) { g.addTo(map); });
        toggleBtn.classList.remove('active');
      }
    });
  }
}

async function init() {
  var id = new URLSearchParams(window.location.search).get('id');
  if (!id) { showError('No map ID provided in the URL.'); return; }
  try {
    await firebase.auth().signInAnonymously();
    var snap = await firebase.database().ref('salesTerritoryData/mapShares/' + id).once('value');
    var data = snap.val();
    if (!data) { showError('Map snapshot not found. The link may be invalid.'); return; }
    renderMap(data);
  } catch(e) {
    showError('Failed to load map. Please check your connection and try again.');
  }
}

init();
</script>
</body>
</html>
