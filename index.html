<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SalesMapper v4 — Enterprise Sales Territory Mapping">
  <title>SalesMap</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ── Loading Overlay ─────────────────────────────────────────────────────── -->
<div id="loadingOverlay" style="display:flex;">
  <div class="loading-spinner"></div>
  <div id="loadingMessage">Initializing...</div>
</div>

<!-- ── Toast Container ─────────────────────────────────────────────────────── -->
<div id="toast-container" aria-live="polite"></div>

<!-- ── Notification Panel (absolute, over map) ─────────────────────────────── -->
<div id="notificationPanel" role="region" aria-label="Notifications" style="display:none;"></div>

<!-- ── App Shell ─────────────────────────────────────────────────────────────── -->
<div id="appShell">

  <!-- ── Top Bar ─────────────────────────────────────────────────────────── -->
  <div id="topBar">
    <div id="appLogo">Sales<span>Map</span></div>
    <div class="topbar-divider"></div>

    <!-- Workspace selector -->
    <select id="profileSelect" title="Select workspace" aria-label="Select workspace">
      <option>Loading...</option>
    </select>
    <button class="topbar-btn topbar-icon-btn" id="newProfileBtn" title="New workspace" aria-label="New workspace"><i class="ph ph-plus"></i></button>
    <button class="topbar-btn topbar-icon-btn" id="deleteProfileBtn" title="Delete workspace" aria-label="Delete workspace"><i class="ph ph-trash"></i></button>

    <div class="topbar-divider"></div>

    <div class="command-menu-wrap">
      <button class="topbar-btn topbar-action-btn" id="addDataMenuBtn" aria-haspopup="menu" aria-expanded="false">
        <i class="ph ph-database"></i><span>Add data</span><i class="ph ph-caret-down"></i>
      </button>
      <div class="command-popover compact-menu" id="addDataMenu" role="menu" hidden>
        <button id="uploadBtn" role="menuitem"><i class="ph ph-upload-simple"></i><span><strong>Upload file</strong><small>CSV, Excel, or text</small></span></button>
        <button id="pasteImportBtn" role="menuitem"><i class="ph ph-clipboard-text"></i><span><strong>Paste data</strong><small>Paste rows from a spreadsheet</small></span></button>
      </div>
    </div>
    <input type="file" id="csvFileInput" accept=".csv,.xlsx,.xls,.txt" style="display:none;" aria-label="Upload CSV or Excel file">

    <div class="command-menu-wrap">
      <button class="topbar-btn topbar-action-btn" id="drawMenuBtn" aria-haspopup="menu" aria-expanded="false">
        <i class="ph ph-polygon"></i><span>Draw</span><i class="ph ph-caret-down"></i>
      </button>
      <div class="command-popover draw-menu" id="drawMenu" role="menu" aria-label="Add to map" hidden>
        <div class="command-popover-title">Add to map</div>
        <button id="drawPointBtn" role="menuitem"><i class="ph ph-map-pin"></i><span><strong>Point</strong><small>Place a location</small></span></button>
        <button id="drawPolygonBtn" role="menuitem"><i class="ph ph-polygon"></i><span><strong>Polygon</strong><small>Draw a sales territory</small></span></button>
        <button id="freeDrawBtn" role="menuitem"><i class="ph ph-pencil-line"></i><span><strong>Free draw</strong><small>Sketch a custom shape</small></span></button>
        <button id="textLabelBtn" role="menuitem"><i class="ph ph-text-t"></i><span><strong>Text label</strong><small>Add a note to the map</small></span></button>
      </div>
    </div>

    <button class="topbar-btn topbar-action-btn" id="planRouteBtn" title="Plan a route"><i class="ph ph-path"></i><span>Plan route</span></button>
    <button class="topbar-btn" id="cancelDrawBtn" title="Cancel drawing (Esc)" style="display:none;"><i class="ph ph-x"></i><span>Cancel</span></button>

    <div class="topbar-divider"></div>
    <button class="topbar-btn history-btn" id="undoBtn" title="Undo (Ctrl+Z)" disabled><i class="ph ph-arrow-u-up-left"></i><span>Undo</span></button>
    <button class="topbar-btn history-btn" id="redoBtn" title="Redo (Ctrl+Y)" disabled><i class="ph ph-arrow-u-up-right"></i><span>Redo</span></button>

    <!-- Right side -->
    <div id="topBarRight">
      <button class="topbar-btn help-btn" id="helpBtn" title="Open getting-started help"><i class="ph ph-question"></i><span>Need help?</span></button>
      <button class="topbar-btn" id="shareLinkBtn" title="Share a view-only link"><i class="ph ph-share-network"></i><span>Share</span></button>
      <div class="command-menu-wrap plugins-menu-wrap">
        <button class="topbar-btn plugins-manage-btn" id="pluginsBtn" title="Manage plugins" aria-haspopup="menu" aria-expanded="false"><i class="ph ph-puzzle-piece"></i><span>Plugins</span><i class="ph ph-caret-down"></i></button>
        <div class="command-popover plugins-menu" id="pluginsMenu" role="menu" hidden>
          <div class="plugins-menu-header">
            <div><strong>Plugins</strong><small>Choose the tools available in this workspace.</small></div>
            <button id="pluginsMenuClose" aria-label="Close plugins"><i class="ph ph-x"></i></button>
          </div>
          <div id="pluginsMenuList">Loading plugins…</div>
        </div>
      </div>
      <div id="pluginToolbarSlot" aria-label="Active plugins"></div>
      <button class="topbar-btn topbar-icon-btn utility-overflow" id="exportMapBtn" title="Export view-only map" aria-label="Export view-only map"><i class="ph ph-download-simple"></i></button>
      <button class="topbar-btn topbar-icon-btn utility-overflow" id="distanceToolBtn" title="Measure distance" aria-label="Measure distance"><i class="ph ph-ruler"></i></button>

      <div class="topbar-divider"></div>

      <!-- Notifications -->
      <div class="notification-btn-wrap">
        <button class="topbar-btn" id="notificationBtn" title="Notifications" aria-label="Notifications">
          <i class="ph ph-bell"></i>
        </button>
        <span id="notificationBadge" role="status" aria-label="Unread notifications"></span>
      </div>
    </div>
  </div>

  <!-- ── Main Content ─────────────────────────────────────────────────────── -->
  <div id="mainContent">

    <button id="mobileLayersBtn" class="mobile-layers-btn" aria-label="Open layers"><i class="ph ph-stack"></i><span>Layers</span></button>

    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <div id="sidebar" role="complementary" aria-label="Layer panel">
      <button id="mobileSidebarClose" class="mobile-sidebar-close" aria-label="Close layers"><i class="ph ph-x"></i></button>

      <!-- Tab buttons -->
      <div class="sidebar-tabs" role="tablist">
        <button class="sidebar-tab-btn active" data-tab="layers" role="tab" aria-selected="true">Layers</button>
        <button class="sidebar-tab-btn" data-tab="analytics" role="tab" aria-selected="false">Analytics</button>
        <button class="sidebar-tab-btn" data-tab="activity" role="tab" aria-selected="false">Activity</button>
      </div>

      <!-- ── Layers Tab ─────────────────────────────────────────────��── -->
      <div id="tab-layers" class="sidebar-tab-content active" role="tabpanel">
        <!-- Layers toolbar -->
        <div class="sidebar-toolbar">
          <button class="btn btn-primary btn-sm" id="newLayerBtn" title="Create a new empty layer"><i class="ph ph-plus"></i> New layer</button>
          <button class="btn btn-secondary btn-sm" id="fitAllBtn" title="Fit map to all layers"><i class="ph ph-arrows-out"></i> Fit all</button>
          <button class="btn btn-secondary btn-sm icon-only" id="zoomInBtn" title="Zoom in" aria-label="Zoom in"><i class="ph ph-plus"></i></button>
          <button class="btn btn-secondary btn-sm icon-only" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out"><i class="ph ph-minus"></i></button>
          <button class="btn btn-secondary btn-sm icon-only" id="resetViewBtn" title="Reset to default view" aria-label="Reset view"><i class="ph ph-crosshair"></i></button>
          <label class="btn btn-secondary btn-sm settings-toggle" title="Real-time sync" style="cursor:pointer;">
            <input type="checkbox" id="realtimeSyncToggle" checked style="margin-right:4px;"> Sync
          </label>
        </div>

        <!-- Layer list -->
        <div id="layerList" role="list" aria-label="Layers">
          <div class="layer-list-empty">No layers yet.<br>Import a CSV to get started.</div>
        </div>

        <!-- Plugin sidebar slot -->
        <div id="pluginSidebarSlot"></div>
      </div>

      <!-- ── Analytics Tab ────────────────────────────────────────────── -->
      <div id="tab-analytics" class="sidebar-tab-content" role="tabpanel">
        <div id="analyticsPanel">
          <div class="analytics-empty">No layers loaded. Import data to see analytics.</div>
        </div>
      </div>

      <!-- ── Activity Tab ───────────────────────────────────────��─────── -->
      <div id="tab-activity" class="sidebar-tab-content" role="tabpanel">
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <button class="btn btn-secondary btn-sm" id="exportActivityBtn">Export CSV</button>
        </div>
        <div id="activityList" role="log" aria-label="Activity log" aria-live="polite"></div>
      </div>

    </div>
    <!-- /sidebar -->

    <!-- ── Map Container ────────────────────────────────────────────────── -->
    <div id="mapContainer">
      <div id="googleMap" aria-label="Sales territory map"></div>

      <!-- Search bar (floating over map) -->
      <div id="searchBar" role="search">
        <input type="text" id="mapSearchInput" placeholder="Search address or place..." aria-label="Search location">
        <button id="mapSearchBtn" aria-label="Search"><i class="ph ph-magnifying-glass"></i></button>
      </div>

      <!-- Drawing hint (floating over map) -->
      <div id="drawingHint" role="status" style="display:none;"></div>

      <!-- Distance tool instructions -->
      <div id="measurementInstructions" role="status" style="display:none;"></div>

      <!-- Map controls (floating) -->
      <div id="mapControlsPanel" aria-label="Map controls">
        <button class="map-ctrl-btn" id="zoomInBtn2" title="Zoom in" onclick="AppRegistry.get('mapManager')?.zoomIn()"><i class="ph ph-plus"></i></button>
        <button class="map-ctrl-btn" id="zoomOutBtn2" title="Zoom out" onclick="AppRegistry.get('mapManager')?.zoomOut()"><i class="ph ph-minus"></i></button>
        <button class="map-ctrl-btn" id="fitAllBtn2" title="Fit all" onclick="AppRegistry.get('layerManager')?.fitToAll()"><i class="ph ph-arrows-out"></i></button>
      </div>
    </div>
    <!-- /mapContainer -->

    <!-- ── Detail Drawer (slides in from right) ─────────────────────────── -->
    <div id="detailDrawer" role="dialog" aria-modal="false" aria-labelledby="drawerTitle">
      <div class="drawer-header">
        <div id="drawerTitle">Details</div>
        <button id="drawerClose" aria-label="Close panel">×</button>
      </div>
      <div id="drawerBody"></div>
    </div>

  </div>
  <!-- /mainContent -->

</div>
<!-- /appShell -->

<!-- ── Context menus (populated dynamically) ──────────────────────────────���── -->
<div id="layerContextMenu" class="context-menu" role="menu" style="display:none;"></div>
<div id="groupContextMenu" class="context-menu" role="menu" style="display:none;"></div>

<!-- ═══════════════════════ CDN DEPENDENCIES ═════════════════════════════════ -->

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>

<!-- Data parsing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Geometry -->
<script src="https://unpkg.com/wellknown@0.5.0/wellknown.js"></script>

<!-- Clustering -->
<script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/error-handler.js"></script>
<script src="js/app-registry.js"></script>
<script src="js/property-service.js"></script>
<script src="js/state-manager.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/validation-service.js"></script>
<script src="js/data-services.js"></script>
<script src="js/plugin-api.js"></script>
<script src="plugins/heatmap-overlay.js"></script>
<script src="plugins/layer-styler.js"></script>
<script src="plugins/data-filter.js"></script>
<script src="plugins/choropleth.js"></script>
<script src="plugins/territory-builder.js"></script>
<script src="plugins/route-optimizer.js"></script>
<script src="plugins/geo-export.js"></script>
<script src="plugins/area-measure.js"></script>
<script src="plugins/radius-tool.js"></script>
<script src="plugins/scout-assistant.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/geocoding-service.js"></script>
<script src="js/csv-parser.js"></script>
<script src="js/map-manager.js"></script>
<script src="js/layer-manager.js"></script>
<script src="js/command-history.js"></script>
<script src="js/analytics-panel.js"></script>
<script src="js/cluster-manager.js"></script>
<script src="js/distance-tool.js"></script>
<script src="js/activity-log.js"></script>
<script src="js/notification-center.js"></script>
<script src="js/map-export.js"></script>
<script src="js/map-share.js"></script>
<script src="js/controllers/sync-controller.js"></script>
<script src="js/controllers/import-controller.js"></script>
<script src="js/controllers/drawing-controller.js"></script>
<script src="js/controllers/profile-controller.js"></script>
<script src="js/controllers/ui-renderer.js"></script>
<script src="js/app.js"></script>

<!-- Google Maps — LAST, loaded from the single key in js/config.js -->
<script>
  (() => {
    const script = document.createElement('script');
    const params = new URLSearchParams({
      key: AppConfig.googleMapsApiKey,
      loading: 'async',
      libraries: 'places,marker,visualization,geometry',
      callback: 'initMap'
    });
    script.async = true;
    script.src = `https://maps.googleapis.com/maps/api/js?${params}`;
    script.onerror = () => {
      loadingManager.forceHide();
      toastManager.error('Google Maps failed to load. Check the API key and allowed website domains.');
    };
    document.head.appendChild(script);
  })();
</script>

</body>
</html>
