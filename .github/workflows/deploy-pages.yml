name: Deploy SalesMap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find js plugins -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html share.html sw.js .nojekyll _site/
          cp -R css js plugins _site/
          # Custom domain must ship in the artifact, or each deploy clears it
          echo map.ebtools.pro > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
